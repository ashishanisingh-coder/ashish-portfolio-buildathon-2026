name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_v3_release:
        description: "Confirm that the legacy V3 artifact may replace the current Pages artifact"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.confirm_v3_release == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Run offline project checks
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages artifact
        run: npm run build:static
        env:
          BASE_PATH: /ashish-portfolio-buildathon-2026/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ inputs.confirm_v3_release == true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
