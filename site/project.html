<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Selected project case study by Ashish Kumar Singh."
      data-project-meta="description"
    />
    <meta name="theme-color" content="#071013" />
    <link rel="canonical" href="/" data-project-canonical />
    <meta property="og:type" content="article" data-project-meta="og:type" />
    <meta
      property="og:title"
      content="Project — Ashish Kumar Singh"
      data-project-meta="og:title"
    />
    <meta
      property="og:description"
      content="Selected project case study by Ashish Kumar Singh."
      data-project-meta="og:description"
    />
    <meta property="og:url" content="/" data-project-meta="og:url" />
    <meta
      property="og:image"
      content="/assets/actual/philips/case-study.jpg"
      data-project-meta="og:image"
    />
    <meta
      property="og:image:alt"
      content="Project case study"
      data-project-meta="og:image:alt"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project — Ashish Kumar Singh" data-project-meta="twitter:title" />
    <meta
      name="twitter:description"
      content="Selected project case study by Ashish Kumar Singh."
      data-project-meta="twitter:description"
    />
    <meta
      name="twitter:image"
      content="/assets/actual/philips/case-study.jpg"
      data-project-meta="twitter:image"
    />
    <title>Project — Ashish Kumar Singh</title>
    <link rel="icon" href="/site/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/site/styles.css" />
    <script>document.documentElement.classList.add('js');</script>
    <script src="/site/project.js" defer></script>
  </head>
  <body class="project-body">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="project-header">
        <a class="brand" href="/" aria-label="Back to Ashish Kumar Singh home">Ashish Kumar Singh</a>
        <a class="project-header__back" href="/">Back to selected work <span aria-hidden="true">↗</span></a>
      </header>

      <main class="project-detail" id="main-content">
        <section class="project-detail__hero" aria-labelledby="project-title" data-reveal>
          <div class="project-detail__copy">
            <p class="project-kicker" data-project-kicker></p>
            <h1 id="project-title" data-project-title></h1>
            <p class="project-detail__intro" data-project-intro></p>
            <div class="project-detail__meta">
              <span data-project-status></span>
              <span data-project-type></span>
            </div>
          </div>
          <figure class="project-detail__hero-media">
            <img src="/assets/actual/philips/case-study.jpg" data-project-hero alt="Project case study" />
            <figcaption data-project-caption></figcaption>
          </figure>
        </section>

        <section class="project-detail__gallery" aria-label="Project frames" data-project-gallery></section>

        <section class="project-detail__closing" aria-labelledby="project-closing-title" data-reveal>
          <p class="project-kicker project-kicker--orange">The work continues</p>
          <h2 id="project-closing-title" data-project-closing></h2>
          <nav class="project-switcher" aria-label="Project navigation">
            <a
              class="project-switcher__link project-switcher__link--previous"
              href="/"
              data-project-previous
              hidden
            >
              <span class="project-switcher__direction">Previous project</span>
              <strong data-project-previous-name></strong>
            </a>
            <a class="text-link project-switcher__index" href="/">Return to selected work <span aria-hidden="true">↗</span></a>
            <a
              class="project-switcher__link project-switcher__link--next"
              href="/"
              data-project-next
              hidden
            >
              <span class="project-switcher__direction">Next project</span>
              <strong data-project-next-name></strong>
            </a>
          </nav>
        </section>
      </main>
    </div>
  </body>
</html>
